server:
  port: 8080

spring:
  main:
    web-application-type: reactive
  application:
    name: gateway
  cloud:
    nacos:
      config:
        import-check:
          enabled: false
      discovery:
        enabled: false
    gateway:
      routes:
        - id: product-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/products/**
          filters:
            - StripPrefix=1
        - id: user-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/auth/**,/api/v1/user/**
          filters:
            - StripPrefix=1
        - id: order-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/cart/**,/api/v1/orders/**,/api/v1/quotes/**
          filters:
            - StripPrefix=1

jwt:
  secret: ${JWT_SECRET:vibecoding-secret-key-must-be-at-least-256-bits-long}
  expire-hours: ${JWT_EXPIRE:24}