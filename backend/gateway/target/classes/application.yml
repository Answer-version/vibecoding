server:
  port: 8080

spring:
  main:
    web-application-type: reactive
  application:
    name: gateway
  cloud:
    nacos:
      config:
        import-check:
          enabled: false
      discovery:
        enabled: false
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: false
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      routes:
        - id: product-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/products/**
        - id: product-service-categories
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/categories/**
        - id: product-service-brands
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/brands/**
        - id: user-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/auth/**,/api/v1/user/**
        - id: order-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/cart/**,/api/v1/orders/**,/api/v1/coupons/**,/api/v1/quotes/**
        - id: order-service-payments
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/payments/**
        - id: wishlist-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/wishlist/**
        - id: review-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/reviews/**

jwt:
  secret: ${JWT_SECRET:vibecoding-secret-key-must-be-at-least-256-bits-long}
  expire-hours: ${JWT_EXPIRE:24}
